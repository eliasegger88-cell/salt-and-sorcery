<style>
:root {
  --gold: #BA7517;
  --gold-light: #EF9F27;
  --gold-dim: #634006;
  --bg: #0a0906;
  --bg2: #111009;
  --bg3: #181510;
  --bg4: #1f1a12;
  --border: rgba(186,117,23,0.2);
  --border-strong: rgba(186,117,23,0.45);
  --text: #e8dcc8;
  --text-dim: #8a7a5e;
  --text-muted: #4a4030;
  --white: #f5ede0;
  --red: #8b1a1a;
  --blue: #1a3a6b;
  --green: #1a4a1a;
  --black: #0a0906;
  --white-mana: #c8bfaa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,9,6,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 58px;
}
.nav-logo {
  font-family: 'Cinzel', serif;
  font-size: 15px; font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.08em;
  display: flex; align-items: center; gap: 10px;
}
.nav-logo .rune { font-size: 22px; }
.nav-links { display: flex; gap: 0; }
.nav-links a {
  font-family: 'Cinzel', serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-decoration: none;
  padding: 0 14px; height: 58px;
  display: flex; align-items: center;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  text-transform: uppercase;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--gold-light);
  border-bottom-color: var(--gold);
}
.nav-burger { display: none; background: none; border: none; cursor: pointer; color: var(--gold); font-size: 22px; }

/* ── HERO ── */
#home {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding-top: 58px;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 60%, rgba(186,117,23,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 80%, rgba(139,26,26,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 30% 40% at 80% 20%, rgba(26,58,107,0.06) 0%, transparent 60%);
}
.mana-symbols {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.mana {
  position: absolute;
  font-size: 48px; opacity: 0.04;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.04; }
  90% { opacity: 0.04; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
.hero-content {
  text-align: center; z-index: 1; padding: 2rem;
  animation: fadeUp 1s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 11px; letter-spacing: 0.3em;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 12px; justify-content: center;
}
.hero-eyebrow::before, .hero-eyebrow::after {
  content: ''; flex: 1; max-width: 60px;
  height: 1px; background: var(--border-strong);
}
.hero-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  font-weight: 700; line-height: 1.05;
  color: var(--white);
  margin-bottom: 0.25rem;
  text-shadow: 0 0 60px rgba(186,117,23,0.3);
}
.hero-title span { color: var(--gold-light); }
.hero-sub {
  font-family: 'Cinzel', serif;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  color: var(--gold-dim); letter-spacing: 0.2em;
  margin-bottom: 1.5rem; text-transform: uppercase;
  font-weight: 400;
}
.hero-desc {
  font-size: 1.15rem; color: var(--text-dim);
  max-width: 520px; margin: 0 auto 2.5rem;
  line-height: 1.7; font-style: italic;
}
.hero-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-gold {
  font-family: 'Cinzel', serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 13px 28px;
  background: var(--gold);
  color: var(--bg);
  border: none; cursor: pointer;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  transition: all 0.2s; text-decoration: none; display: inline-block;
}
.btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-outline {
  font-family: 'Cinzel', serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 12px 28px;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--border-strong);
  cursor: pointer; transition: all 0.2s;
  text-decoration: none; display: inline-block;
}
.btn-outline:hover { background: rgba(186,117,23,0.08); border-color: var(--gold); }

.mana-row {
  display: flex; gap: 16px; justify-content: center;
  margin-top: 3rem;
}
.mana-pip {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
  border: 2px solid;
  opacity: 0.6; transition: opacity 0.2s;
}
.mana-pip:hover { opacity: 1; }
.mana-w { background: rgba(200,191,170,0.1); border-color: var(--white-mana); color: var(--white-mana); }
.mana-u { background: rgba(26,58,107,0.3); border-color: #4a7bc4; color: #4a7bc4; }
.mana-b { background: rgba(40,20,50,0.4); border-color: #9a6bc4; color: #9a6bc4; }
.mana-r { background: rgba(139,26,26,0.3); border-color: #c44a4a; color: #c44a4a; }
.mana-g { background: rgba(26,74,26,0.3); border-color: #4ab44a; color: #4ab44a; }

/* ── SECTIONS ── */
section { padding: 5rem 2rem; }
.section-inner { max-width: 960px; margin: 0 auto; }
.section-header { text-align: center; margin-bottom: 3rem; }
.section-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.75rem;
  display: flex; align-items: center; gap: 10px; justify-content: center;
}
.section-eyebrow::before, .section-eyebrow::after {
  content: ''; width: 30px; height: 1px; background: var(--border-strong);
}
.section-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  font-weight: 600; color: var(--white);
}
.divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 1rem auto 0;
}

/* ── ABOUT ── */
#ueber { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
.about-text p { font-size: 1.1rem; line-height: 1.8; color: var(--text-dim); margin-bottom: 1rem; }
.about-text p:last-child { margin-bottom: 0; }
.about-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.stat-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 1.25rem; text-align: center;
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}
.stat-num {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem; font-weight: 700;
  color: var(--gold-light); display: block;
}
.stat-lbl { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.05em; }

/* ── EVENTS ── */
#events { background: var(--bg); }
.event-grid { display: grid; gap: 1rem; }
.event-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  padding: 1.25rem 1.5rem;
  display: flex; align-items: center; gap: 1.5rem;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.event-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(186,117,23,0.05) 0%, transparent 40%);
  pointer-events: none;
}
.event-card:hover { border-color: var(--gold-light); transform: translateX(3px); }
.event-date-box {
  text-align: center; min-width: 56px;
  font-family: 'Cinzel', serif;
}
.event-day { font-size: 1.8rem; font-weight: 700; color: var(--gold-light); line-height: 1; }
.event-month { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.event-info { flex: 1; }
.event-name { font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--white); margin-bottom: 4px; }
.event-meta-row { font-size: 0.9rem; color: var(--text-dim); display: flex; gap: 12px; flex-wrap: wrap; }
.event-format-badge {
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.1em;
  padding: 3px 10px;
  border: 1px solid var(--border-strong);
  color: var(--gold); text-transform: uppercase;
}
.event-spots { font-size: 0.85rem; color: var(--text-dim); text-align: right; white-space: nowrap; }
.spots-num { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-light); display: block; }

/* ── ANMELDUNG MODAL ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 200;
  align-items: center; justify-content: center; padding: 1rem;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--bg3);
  border: 1px solid var(--border-strong);
  padding: 2rem; width: 100%; max-width: 400px;
  position: relative;
}
.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: 20px;
}
.modal h2 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--white); margin-bottom: 0.25rem; }
.modal-event-name { font-size: 0.9rem; color: var(--gold); margin-bottom: 1.5rem; }
.field { margin-bottom: 1rem; }
.field label { font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 6px; font-family: 'Cinzel', serif; }
.field input {
  width: 100%; padding: 10px 12px;
  background: var(--bg4); border: 1px solid var(--border);
  color: var(--text); font-size: 1rem; font-family: 'Crimson Pro', serif;
  transition: border 0.2s;
}
.field input:focus { outline: none; border-color: var(--gold); }
.modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
.badge-status {
  font-size: 11px; padding: 2px 10px;
  font-family: 'Cinzel', serif; letter-spacing: 0.08em;
}
.badge-open { border: 1px solid #4ab44a; color: #4ab44a; }
.badge-full { border: 1px solid #c44a4a; color: #c44a4a; }
.badge-soon { border: 1px solid var(--gold); color: var(--gold); }

/* ── TURNIER ── */
#turniere { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.results-table { width: 100%; border-collapse: collapse; }
.results-table th {
  font-family: 'Cinzel', serif; font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); text-align: left;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border-strong);
}
.results-table td {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 1rem; color: var(--text-dim);
}
.results-table tr:last-child td { border-bottom: none; }
.results-table tr:hover td { background: rgba(186,117,23,0.04); }
.rank-gold { color: var(--gold-light); font-family: 'Cinzel', serif; font-weight: 600; }
.rank-silver { color: var(--white-mana); font-family: 'Cinzel', serif; }
.rank-bronze { color: #c47a4a; font-family: 'Cinzel', serif; }
.rank-fourth { color: #8a9aa8; font-family: 'Cinzel', serif; }
.player-name { color: var(--white); }

/* ── GALERIE ── */
#galerie { background: var(--bg); }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.gallery-item {
  aspect-ratio: 4/3;
  background: var(--bg3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; opacity: 0.4;
  transition: all 0.2s; cursor: pointer;
  position: relative; overflow: hidden;
}
.gallery-item:hover { opacity: 0.7; border-color: var(--gold); }
.gallery-item span { position: relative; z-index: 1; }
.gallery-placeholder { font-size: 0.75rem; color: var(--text-muted); position: absolute; bottom: 8px; font-family: 'Cinzel', serif; letter-spacing: 0.05em; }

/* ── KONTAKT ── */
#kontakt { background: var(--bg2); border-top: 1px solid var(--border); }
.kontakt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
.kontakt-info h3 { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--white); margin-bottom: 1rem; }
.kontakt-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 0.875rem; }
.kontakt-icon { color: var(--gold); font-size: 1.1rem; margin-top: 2px; }
.kontakt-text { font-size: 1rem; color: var(--text-dim); line-height: 1.5; }
.kontakt-form h3 { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--white); margin-bottom: 1rem; }
.form-field { margin-bottom: 0.875rem; }
.form-field input, .form-field textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg4); border: 1px solid var(--border);
  color: var(--text); font-size: 1rem; font-family: 'Crimson Pro', serif;
  transition: border 0.2s; resize: none;
}
.form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--gold); }
.form-field textarea { height: 90px; }

/* ── FOOTER ── */
footer {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 1.5rem 2rem;
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 0.75rem; letter-spacing: 0.1em;
  color: var(--text-muted);
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--gold); color: var(--bg);
  padding: 10px 22px; font-family: 'Cinzel', serif;
  font-size: 12px; letter-spacing: 0.08em;
  z-index: 999; transition: transform 0.3s;
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 680px) {
  .nav-links { display: none; }
  .nav-burger { display: block; }
  .nav-links.open {
    display: flex; flex-direction: column;
    position: fixed; top: 58px; left: 0; right: 0;
    background: rgba(10,9,6,0.98);
    border-bottom: 1px solid var(--border);
    padding: 1rem 0;
  }
  .nav-links.open a { height: 44px; padding: 0 1.5rem; }
  .about-grid { grid-template-columns: 1fr; }
  .kontakt-grid { grid-template-columns: 1fr; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  .event-card { flex-wrap: wrap; }
}

/* ── ADMIN ── */
.admin-lock {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 500; display: flex; align-items: center; justify-content: center;
  display: none;
}
.admin-lock.open { display: flex; }
.admin-box {
  background: var(--bg3); border: 1px solid var(--border-strong);
  padding: 2.5rem; width: 340px; text-align: center;
}
.admin-box h2 { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--white); margin-bottom: 0.5rem; }
.admin-box p { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 1.5rem; font-style: italic; }
.admin-box input {
  width: 100%; padding: 10px 12px; margin-bottom: 1rem;
  background: var(--bg4); border: 1px solid var(--border);
  color: var(--text); font-size: 1rem; font-family: 'Crimson Pro', serif;
  text-align: center; letter-spacing: 0.1em;
}
.admin-box input:focus { outline: none; border-color: var(--gold); }
.admin-error { color: #c44a4a; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
#admin-section {
  padding: 5rem 2rem; background: var(--bg2);
  border-top: 1px solid var(--border); display: none;
}
#admin-section.visible { display: block; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
.admin-header h2 { font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--white); }
.admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; max-width: 960px; margin: 0 auto 2rem; }
.admin-stat { background: var(--bg3); border: 1px solid var(--border); padding: 1.25rem; text-align: center; }
.admin-stat-num { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--gold-light); display: block; }
.admin-stat-lbl { font-size: 0.85rem; color: var(--text-dim); }
.admin-table-wrap { max-width: 960px; margin: 0 auto; overflow-x: auto; }
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th {
  font-family: 'Cinzel', serif; font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); text-align: left;
  padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-strong);
}
.admin-table td { padding: 0.875rem 1rem; border-bottom: 1px solid var(--border); font-size: 1rem; color: var(--text-dim); }
.admin-table tr:hover td { background: rgba(186,117,23,0.04); }
.admin-table .name { color: var(--white); }
.export-btn { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; background: transparent; color: var(--gold); border: 1px solid var(--border-strong); cursor: pointer; }
.export-btn:hover { background: rgba(186,117,23,0.08); }
.admin-nav-link { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em; color: var(--text-dim); text-decoration: none; padding: 0 14px; height: 58px; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: all 0.2s; text-transform: uppercase; cursor: pointer; }
.admin-nav-link:hover { color: var(--gold-light); border-bottom-color: var(--gold); }

/* ── AUTH / PROFIL ── */
.auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.auth-tab {
  flex: 1; text-align: center; padding: 10px 0; cursor: pointer;
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-dim); border-bottom: 2px solid transparent; transition: all 0.2s;
}
.auth-tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }
.auth-error { color: #c44a4a; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
.profile-info { margin-bottom: 1.5rem; }
.profile-info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
.profile-info-row span:first-child { color:
